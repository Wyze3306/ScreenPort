name: Paquet .deb

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier une release GitHub (tag v<version> sur ce commit)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-vte-3.91 gir1.2-secret-1 \
            openssh-client lintian desktop-file-utils appstream

      - name: Tests unitaires
        run: python3 -m unittest discover -s tests -t . -v

      - name: Vérifier le chargement des modules GTK
        run: python3 -c "import screenport.application, screenport.window, screenport.preferences"

      - name: Valider les métadonnées
        run: |
          desktop-file-validate data/io.github.wyze3306.ScreenPort.desktop
          appstreamcli validate --no-net data/io.github.wyze3306.ScreenPort.metainfo.xml

      - name: Construire le paquet
        run: packaging/build-deb.sh

      - name: Lintian
        run: lintian --tag-display-limit 0 dist/*.deb

      - name: Tester l'installation
        run: |
          sudo apt-get install -y ./dist/*.deb
          screenport --version
          test -x /usr/lib/screenport/bin/screenport-askpass

      - uses: actions/upload-artifact@v4
        with:
          name: screenport-deb
          path: dist/*.deb

      - name: Version du paquet
        id: version
        run: echo "tag=v$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' screenport/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: Vérifier la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then test "$TAG" = "$GITHUB_REF_NAME"; fi
          test -f "docs/release-notes/$TAG.md"

      # Sur un tag poussé, ou via « Run workflow » avec « publier » coché :
      # crée le tag sur ce commit (s'il n'existe pas) et la release avec le .deb.
      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ScreenPort ${{ steps.version.outputs.tag }}
          body_path: docs/release-notes/${{ steps.version.outputs.tag }}.md
          files: dist/*.deb
          fail_on_unmatched_files: true
