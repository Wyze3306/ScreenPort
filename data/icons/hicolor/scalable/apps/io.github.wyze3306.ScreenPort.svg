<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a72"/>
      <stop offset="1" stop-color="#202842"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2133"/>
      <stop offset="1" stop-color="#15161f"/>
    </linearGradient>
    <linearGradient id="port" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="1" stop-color="#5b8cf5"/>
    </linearGradient>
    <linearGradient id="back1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3a6ff"/>
      <stop offset="1" stop-color="#9a78e8"/>
    </linearGradient>
    <linearGradient id="back2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd38a"/>
      <stop offset="1" stop-color="#e9a84c"/>
    </linearGradient>
  </defs>

  <!-- socle -->
  <rect x="8" y="14" width="112" height="106" rx="22" fill="#151a2b"/>
  <rect x="8" y="8" width="112" height="106" rx="22" fill="url(#base)"/>
  <rect x="8.5" y="8.5" width="111" height="105" rx="21.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- screens empilés -->
  <rect x="42" y="20" width="66" height="46" rx="8" fill="url(#back2)"/>
  <rect x="42" y="20" width="66" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="31" y="30" width="66" height="46" rx="8" fill="url(#back1)"/>
  <rect x="31" y="30" width="66" height="10" rx="5" fill="#ffffff" fill-opacity="0.25"/>

  <!-- terminal principal -->
  <rect x="18" y="42" width="74" height="56" rx="9" fill="#0d0e15"/>
  <rect x="19.5" y="43.5" width="71" height="53" rx="7.5" fill="url(#glass)" stroke="#7aa2f7" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="28" cy="51" r="2.2" fill="#f7768e"/>
  <circle cx="35" cy="51" r="2.2" fill="#e0af68"/>
  <circle cx="42" cy="51" r="2.2" fill="#9ece6a"/>
  <path d="M29 63 L39 70.5 L29 78" fill="none" stroke="#9ece6a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="44" y="77" width="20" height="5" rx="2.5" fill="#c0caf5"/>

  <!-- port de connexion -->
  <circle cx="94" cy="90" r="20" fill="#151a2b" fill-opacity="0.55"/>
  <circle cx="94" cy="88" r="18" fill="url(#port)"/>
  <path d="M85 83 H101 M97 79 L101 83 L97 87" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M103 94 H87 M91 90 L87 94 L91 98" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
